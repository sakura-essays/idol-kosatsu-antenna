name: Collect, discover and publish
on:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', 'config/**', 'tests/**', '.github/workflows/**']
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: idol-antenna-state
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore initial source checkpoint if present
        run: |
          if [ -f source-checkpoint.zip ]; then
            python -m zipfile -e source-checkpoint.zip .
          fi
      - name: Verify catalog and regressions
        run: |
          python -m unittest discover -s tests -v
          node tests/search.cjs
      - name: Check migration state
        id: migration
        run: |
          python -c 'import json, pathlib; s=json.load(open("state/status.json")); print("needed="+("yes" if "metrics" not in s or pathlib.Path("state/bootstrap-articles.json").is_file() else "no"))' >> "$GITHUB_OUTPUT"
      - name: Collect feeds, discover authors and recheck articles
        if: github.event_name != 'push' || steps.migration.outputs.needed == 'yes'
        run: python scripts/collect.py
      - name: Build public metadata only
        run: python scripts/build.py
      - name: Persist cumulative metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md LICENSE .gitignore scripts config state web dist docs tests .github/ISSUE_TEMPLATE
          git rm --ignore-unmatch source-checkpoint.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Update idol articles and discovery state'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
