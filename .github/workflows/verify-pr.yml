name: Verify pull requests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test publication and catalog
        run: python -m unittest discover -s tests -v
      - name: Test search
        run: node tests/search.cjs
      - name: Build without collecting or publishing
        run: python scripts/build.py
